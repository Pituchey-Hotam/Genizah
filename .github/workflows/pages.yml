# The landing page owns its screenshots in site/images; the ribbon icon is copied in.
# Deploys from master, so the page changes with releases.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - site/**
      - Genizah/Resources/CensorNames.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble
        run: |
          cp -r site _site
          mkdir -p _site/images
          cp Genizah/Resources/CensorNames.png _site/images/icon.png

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
