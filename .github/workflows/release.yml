# A manual run on master publishes v<VERSION>: a GitHub release, marked latest,
# holding the version's signed manifests and every file they list, under flat names, and the
# offline installer. Installed copies update from the latest release. It is uploaded as a draft,
# checked, and only then published, so an update never sees a half-uploaded release. See
# docs/RELEASING.md.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Require master
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/master ]; then
            echo "::error::Run Release from the master branch"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: VERSION is new and greater than every release
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          if ! [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH, not '$v'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "::error file=VERSION::v$v is already released: bump VERSION"; exit 1
          fi
          latest=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n 1)" != "$v" ]; then
            echo "::error file=VERSION::VERSION $v is lower than the latest release, v$latest"; exit 1
          fi
          echo "This run releases v$v (latest: ${latest:+v}${latest:-none})"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release-signing: true
    secrets:
      GENIZAH_SIGNING_PFX: ${{ secrets.GENIZAH_SIGNING_PFX }}
      GENIZAH_SIGNING_PASSWORD: ${{ secrets.GENIZAH_SIGNING_PASSWORD }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create the release as a draft
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error file=VERSION::$TAG is already released: bump VERSION before running Release"; exit 1
          fi
          # A draft left by an earlier, failed run of this release.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Notes cover the PRs since the last add-in release, not since a model-* release.
          previous=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          gh release create "$TAG" --draft \
            --target "$GITHUB_SHA" \
            --title "Genizah ${TAG#v}" \
            --generate-notes ${previous:+--notes-start-tag "$previous"}
          gh release upload "$TAG" dist/assets/* dist/Genizah-Setup-*.exe

      # GitHub renames some asset names, and the updater downloads files by name: every file must
      # be there, under its own name and with its own size.
      - name: Check the uploaded assets
        run: |
          for f in dist/assets/* dist/Genizah-Setup-*.exe; do echo "$(basename "$f") $(stat -c %s "$f")"; done | sort > expected.txt
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > uploaded.txt
          if ! diff expected.txt uploaded.txt; then
            echo "::error::the draft's assets differ from the build's (above); it stays a draft"; exit 1
          fi

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
