# Documentation, site and scratch-only changes skip CI; manual runs are always available.
name: CI

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
      - 'scratch/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
      - 'scratch/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
